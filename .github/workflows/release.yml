name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/laohuang
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python scripts/check_versions.py --tag "$GITHUB_REF_NAME"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: scripts/build-python.sh
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
        working-directory: npm
      - run: npm test
        working-directory: npm
      - run: npm pack --dry-run
        working-directory: npm
      - id: registry
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "laohuang@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published != 'true'
        run: npm publish
        working-directory: npm
