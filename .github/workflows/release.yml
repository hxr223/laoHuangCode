name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: npm-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/laohuang
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the commit came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged_pr_count="$(
            gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length'
          )"
          if [[ "$merged_pr_count" -lt 1 ]]; then
            echo "::error::Refusing to publish: $GITHUB_SHA was not merged into main through a pull request."
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: python -m pip install -e . build
      - run: npm ci
        working-directory: npm
      - name: Read and validate the release version
        id: package
        run: |
          version="$(python scripts/check_versions.py --print-version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Require an unpublished npm version
        run: python scripts/check_npm_unpublished.py
      - name: Run the complete release check
        run: scripts/release-check.sh
      - name: Publish npm package with provenance
        run: npm publish --access public --provenance
        working-directory: npm
      - name: Verify the published version
        env:
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          published_version="$(npm view "laohuang@$EXPECTED_VERSION" version)"
          if [[ "$published_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Expected laohuang@$EXPECTED_VERSION, got $published_version"
            exit 1
          fi
