name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python scripts/check_versions.py --tag "$GITHUB_REF_NAME"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  publish-python:
    needs: build-python
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/laohuangcode
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-npm:
    needs: publish-python
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/laohuang
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
        working-directory: npm
      - run: npm test
        working-directory: npm
      - run: npm publish
        working-directory: npm
