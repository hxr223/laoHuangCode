name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: Recover standalone assets for the already published npm latest version (X.Y.Z)
        type: string
        required: true

concurrency:
  group: npm-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.recovery.outputs.sha || github.sha }}
      required: ${{ steps.changes.outputs.required }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Detect product changes
        if: github.event_name == 'push'
        id: changes
        env:
          BASE_SHA: ${{ github.event.before }}
        run: node scripts/release-control.mjs changes "$BASE_SHA"
      - name: Validate published version and recover its source commit
        if: github.event_name == 'workflow_dispatch'
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: node scripts/release-control.mjs recover "$VERSION"

  publish-npm:
    needs: prepare
    if: github.event_name == 'push' && needs.prepare.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/laohuang
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the commit came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged_pr_count="$(
            gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length'
          )"
          if [[ "$merged_pr_count" -lt 1 ]]; then
            echo "::error::Refusing to publish: $GITHUB_SHA was not merged into main through a pull request."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Read the release version
        id: package
        run: echo "version=$(node --print 'require("./apps/cli/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Require an unpublished npm version
        run: npm run check:version
      - name: Publish npm package with trusted publishing
        run: npm publish --workspace laohuang --access public
      - name: Verify the published version
        env:
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: npm run verify:published -- "$EXPECTED_VERSION" --attempts 31 --interval-ms 10000

  standalone:
    needs: [prepare, publish-npm]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.publish-npm.result == 'success' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/standalone.yml
    with:
      validate-installation: false
      source-ref: ${{ needs.prepare.outputs.sha }}

  publish-standalone:
    needs: [prepare, standalone]
    if: always() && !cancelled() && needs.standalone.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: .build/standalone
          merge-multiple: true
      - name: Publish verified standalone assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          version="$(cat .build/standalone/version.txt)"
          test "$version" = "$(node --print 'require("./apps/cli/package.json").version')"
          for target in darwin-x64 darwin-arm64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            extension=tar.gz
            if [[ "$target" == win32-* ]]; then extension=zip; fi
            archive="laohuang-$version-$target.$extension"
            (cd .build/standalone && sha256sum -c "$archive.sha256")
          done
          cp install.sh install.ps1 .build/standalone/
          if gh release view "v$version" --json isDraft,targetCommitish > .build/release.json; then
            node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync(".build/release.json")); if (!r.isDraft || r.targetCommitish !== process.env.RELEASE_SHA) throw new Error("Refusing to replace a published release or another commit");'
          else
            gh release create "v$version" --target "$RELEASE_SHA" --title "laohuang $version" --generate-notes --draft
          fi
          gh release upload "v$version" .build/standalone/* --clobber
          gh release edit "v$version" --draft=false --latest
