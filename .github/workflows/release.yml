name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: npm-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/laohuang
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify the commit came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          merged_pr_count="$(
            gh api "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length'
          )"
          if [[ "$merged_pr_count" -lt 1 ]]; then
            echo "::error::Refusing to publish: $GITHUB_SHA was not merged into main through a pull request."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Read the release version
        id: package
        run: echo "version=$(node --print 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Require an unpublished npm version
        run: npm run check:version
      - name: Publish npm package with trusted publishing
        run: npm publish --access public
      - name: Verify the published version
        env:
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: npm run verify:published -- "$EXPECTED_VERSION"
