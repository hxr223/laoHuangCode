name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - run: node apps/cli/dist/bin.js --version

  test:
    # The test suite imports and spawns the TypeScript sources directly, which
    # relies on Node's built-in type stripping (Node >= 22.18).
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ["22"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      - name: Install tmux for stdin regression tests (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y tmux
      - name: Install tmux for stdin regression tests (macOS)
        if: runner.os == 'macOS'
        run: brew list tmux || brew install tmux
      - run: npm test
      - run: npm run smoke:package

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node apps/cli/dist/bin.js --version
      - name: Windows paths, console adapter, and process lifecycle
        run: node --test scripts/local-paths.test.ts scripts/windows-terminal.test.ts scripts/bash-process-windows.test.ts scripts/tui-input.test.ts scripts/stdin-prompts.test.ts scripts/startup-stdin.test.ts

  version:
    # Every merged pull request is an npm publish: the version must be a stable
    # X.Y.Z SemVer, not yet published, and above npm's current latest.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Validate the package version
        run: npm run check:version
