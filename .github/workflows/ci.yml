name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  standalone:
    uses: ./.github/workflows/standalone.yml
    with:
      platforms: '["ubuntu-latest"]'
      node-version: "24"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node apps/cli/dist/bin.js --version
      - run: npm run smoke:package -- --skip-build
      - uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: |
            apps/cli/dist/
            packages/*/*/dist/
          if-no-files-found: error
          retention-days: 1

  test:
    # Workspace imports and CLI subprocess tests need the shared build output.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          name: test-build
          path: .
      - name: Install tmux for stdin regression tests
        run: sudo apt-get install -y tmux
      - run: node --test --test-shard=${{ matrix.shard }}/5 "scripts/**/*.test.ts"

  version:
    # Every merged pull request is an npm publish: the version must be a stable
    # X.Y.Z SemVer, not yet published, and above npm's current latest.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Validate the package version
        run: npm run check:version
