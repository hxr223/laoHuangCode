name: Standalone packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test scripts/installer.test.ts
      - run: npm run build:standalone
      - run: npm run smoke:standalone
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: .build/standalone/*
          if-no-files-found: error
          retention-days: 7
