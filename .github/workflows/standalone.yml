name: Standalone packages

on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of runner labels to build on
        type: string
        default: '["ubuntu-22.04", "ubuntu-22.04-arm", "macos-15", "macos-15-intel", "windows-2025", "windows-11-arm"]'
      node-version:
        description: Node.js version used for build and validation tooling
        type: string
        default: '22.23.2'
      validate-installation:
        description: Run installer tests and installation/update smoke checks
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node --test scripts/installer.test.ts
        if: inputs.validate-installation
      - run: npm run build:standalone
      - run: npm run smoke:standalone
        if: inputs.validate-installation
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.os }}
          path: .build/standalone/*
          if-no-files-found: error
          retention-days: 7
